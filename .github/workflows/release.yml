# Publishes a release when a version tag is pushed:
#   git tag v0.2.0
#   git push origin v0.2.0
# Installed copies of Tempo pick up the new version from GitHub Releases within a few hours.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  VELOPACK_VERSION: 1.2.161

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag '${{ github.ref_name }}' must look like v1.2.3." }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test Tempo.sln -c Release

      - name: Publish
        run: dotnet publish src/Tempo.App/Tempo.App.csproj -c Release -r win-x64 --self-contained -p:Version=${{ steps.version.outputs.value }} -o publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VELOPACK_VERSION }}

      # The previous release lets vpk build a small delta package alongside the full one.
      - name: Download previous release
        run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o Releases

      - name: Pack
        run: >
          vpk pack -u Tempo -v ${{ steps.version.outputs.value }} -p publish -e Tempo.exe
          --packTitle Tempo --packAuthors "Teerakit Chantrakul" -i src/Tempo.App/Assets/Tempo.ico -o Releases

      # Only what installs and updates need: no portable zip or legacy RELEASES file,
      # and not the previous version's package that was downloaded above.
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $files = @('Releases/Tempo-win-Setup.exe', 'Releases/releases.win.json', "Releases/Tempo-$version-full.nupkg")
          if (Test-Path "Releases/Tempo-$version-delta.nupkg") { $files += "Releases/Tempo-$version-delta.nupkg" }
          gh release create '${{ github.ref_name }}' @files --verify-tag --title "Tempo $version" --notes ''
